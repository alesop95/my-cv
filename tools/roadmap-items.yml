# Voci aperte dell'ecosistema, fonte unica della roadmap operativa.
#
# Questo file contiene solo ciò che una macchina non può dedurre: quale lavoro resta, dove vive e
# perché. Lo stato misurabile (commit, deriva delle schede, raggiungibilità dei link, presenza di
# un difetto nel sorgente) non si scrive qui: lo misura tools/roadmap.py a ogni esecuzione, così
# la lista non può invecchiare come invecchiava il diagramma scritto a mano di luglio.
#
# Campi. `id` è stabile e non si riusa. `livello` è il costo: 0 minuti e nessuna decisione, 1
# mezz'ora e nessuna decisione di contenuto, 2 sessione dedicata con una decisione dell'utente,
# 3 lavoro che non si chiude dentro questo repository. `dove` è il repository. `sonda` è
# facoltativa e dice alla macchina come stabilire da sola se la voce è ancora aperta: senza sonda
# la voce resta aperta finché qualcuno non la toglie da qui.
#
# Sonde disponibili, implementate in tools/roadmap.py:
#   ecosystem           aperta se extract-ecosystem.py --check rileva deriva
#   cvlinks             aperta se extract-cv-links.py --check rileva deriva
#   mdunwrap            aperta se md-unwrap --check segnala un file tracciato
#   presente:FILE:REGEX aperta se la regex compare nel file
#   assente:FILE:REGEX  aperta se la regex NON compare nel file

titolo: Roadmap operativa di my-cv e del suo ecosistema

# Dove vivono le schede con il frontmatter di riconciliazione, per misurarne la distanza da HEAD.
cartella-schede: .claude/context

# Controlli eseguiti a ogni invocazione. Exit 0 significa in ordine. Il filtro facoltativo
# `solo-file-tracciati` legge l'elenco dei file segnalati e considera in ordine il caso in cui
# nessuno di essi sia tracciato da git.
controlli:
  - nome: grafo di architettura
    chiave: ecosystem
    comando: python tools/extract-ecosystem.py --check
    rimedio: python tools/extract-ecosystem.py --write
  - nome: inventario dei link
    chiave: cvlinks
    comando: python tools/extract-cv-links.py --check
    rimedio: python tools/extract-cv-links.py --write
  - nome: convenzione Markdown
    chiave: mdunwrap
    comando: python tools/md-unwrap.py --check .
    filtro: solo-file-tracciati
    rimedio: python tools/md-unwrap.py <file>

# Comando di verifica dei link, eseguito solo con --link-check perche va in rete. Si dichiara per
# piattaforma: uno script di shell invocato da Python non eredita la shell della sessione ma quella
# che il sistema risolve per prima, che su Windows e la bash di WSL e non quella di Git.
verifica-link:
  windows: powershell -NoProfile -File scripts/check-links.ps1
  posix: bash scripts/check-links.sh

livelli:
  0: "Minuti, nessuna decisione da prendere"
  1: "Mezz'ora, ancora nessuna decisione di contenuto"
  2: "Sessione dedicata, decisione di contenuto dell'utente"
  3: "Fuori da my-cv, ma è da qui che dipende il resto"

