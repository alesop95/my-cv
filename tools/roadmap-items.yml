    dove: my-cv
    titolo: Il difetto Hold Me Tight è dichiarato aperto ma non esiste più
    stato: Verificato il 2026-09-22. La stringa non è più in main.tex, perché la sezione dei corsi è stata ridotta a una riga il 2026-07-15, e nelle due occorrenze migrate in projects le virgolette sono dritte sia in apertura sia in chiusura, quindi simmetriche. L'asimmetria che costituiva il difetto non esiste in nessuno dei due repository.
    passo: Depennarlo dai difetti noti di index.md e dalla mappa dello stato di roadmap.md, dichiarandolo non più applicabile invece che corretto.
    fonte: ".claude/memory/index.md, .claude/context/roadmap.md, projects/docs/courses/humanities.md"
    sonda: "presente:main.tex:Hold Me Tight"

